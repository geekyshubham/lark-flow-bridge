name: Build macOS app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test receiver status and setting safety
        run: ./scripts/test.sh
      - name: Build and package Apple Silicon and Intel app
        run: ./scripts/package.sh
      - name: Verify app bundle and scripts
        run: ./scripts/check.sh
      - name: Upload downloadable app and checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: LARK-Flow-Bridge-macOS
          path: dist/
          retention-days: 30
